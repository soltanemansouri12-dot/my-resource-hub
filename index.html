<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة البيع والشراء</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: auto; }
        .product-card { background: white; padding: 15px; margin: 10px 0; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .available { color: green; font-weight: bold; }
        .sold { color: red; font-weight: bold; }
        .btn { display: inline-block; padding: 10px 20px; background-color: #25d366; color: white; text-decoration: none; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>سوق المنصة الرقمي</h1>
    
    <!-- عينة لعرض بيع حقيقي -->
    <div class="product-card">
        <h3>جهاز إلكتروني متطور</h3>
        <p>السعر: 50,000 دج</p>
        <p class="available">الحالة: متوفر للبيع</p>
        <a href="https://wa.me/213XXXXXXXXXX?text=أنا مهتم بشراء جهاز إلكتروني متطور" class="btn">شراء الآن عبر واتساب</a>
    </div>

    <div class="product-card">
        <h3>أدوات رياضية</h3>
        <p>السعر: 15,000 دج</p>
        <p class="sold">الحالة: تم البيع</p>
        <button class="btn" style="background-color:gray" disabled>غير متوفر</button>
    </div>
</div>

</body>
</html>
